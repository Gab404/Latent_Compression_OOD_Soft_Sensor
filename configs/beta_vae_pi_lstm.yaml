# configs/beta_vae_pi_lstm.yaml
# ==============================
# β-VAE-PI-LSTM: Physics-Informed LSTM driven by 64-dimensional β-VAE
# latent vectors (posterior means, β=4.0) extracted from Raman spectra.
#
# Identical hyperparameters to cvae_pi_lstm.yaml — only the encoder changes.

name: beta_vae_pi_lstm

data:
  csv_path:           ./100_Batches_IndPenSim_V3.csv
  use_raman:          true
  raman_encoder_type: beta_vae
  raman_ckpt:         ./checkpoints/beta_vae_best.pt
  raman_scaler:       ./checkpoints/beta_vae_scaler.joblib
  raman_latent_dim:   64

  split_strategy:     random
  train_frac:         0.80
  seed:               42
  min_len:            50

model:
  hidden_size:      64
  num_lstm_layers:  2
  fc_hidden:        32
  lstm_dropout:     0.2
  k_prod_init:      1.0

training:
  seq_len:      24
  dt:           0.2
  batch_size:   64
  n_epochs:     200

  lr:           1.0e-3
  lr_physics:   1.0e-2
  weight_decay: 1.0e-4

  lr_factor:    0.5
  lr_patience:  15

  es_patience:  30

  grad_clip:    5.0

  vanilla_mode:          false
  lambda_physics_start:  0.0
  lambda_physics_end:    0.1
  lambda_anneal_delay:   30
  lambda_anneal_epochs:  80

output:
  checkpoint: ./checkpoints/beta_vae_pi_lstm.pt
  plots_dir:  ./outputs/beta_vae_pi_lstm/
