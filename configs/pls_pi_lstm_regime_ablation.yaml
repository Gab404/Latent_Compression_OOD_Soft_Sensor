# configs/pls_pi_lstm_regime_ablation.yaml
# =========================================
# PLS-PI-LSTM Regime-Ablation — physics-informed LSTM trained exclusively on
# Regime 1 (batches 1-30) and evaluated on R2, R3, and Faulty batches.
# Encoder: PLS with 64 components, refitted on Regime 1 training data only.
#
# Use with:  --model pls_pi_lstm --regime-ablation
#
# Split (driven by train.py --regime-ablation flag):
#   Train / Val → Regime 1 (batches 1-30), 80/20 random, seed=42
#   Test R2     → Regime 2 (batches 31-60, operator-controlled)
#   Test R3     → Regime 3 (batches 61-90, APC closed-loop)
#   Test Fault  → Faulty   (batches 91-100)
#
# PLS encoder: 64 components, fitted on Regime 1 train batches (24 batches).
#   checkpoints/pls_best_64.joblib    — PLSRegression(n_components=64, scale=False)
#   checkpoints/pls_scaler_64.joblib  — StandardScaler fitted on same data

name: pls_pi_lstm_regime_ablation

data:
  csv_path:           ./100_Batches_IndPenSim_V3.csv
  use_raman:          true
  raman_encoder_type: pls_v2
  raman_ckpt:         ./checkpoints/pls_best_64.joblib
  raman_scaler:       ./checkpoints/pls_scaler_64.joblib
  raman_latent_dim:   64

  split_strategy:     random   # overridden by --regime-ablation at runtime
  train_frac:         0.80
  seed:               42
  min_len:            50

model:
  hidden_size:      64
  num_lstm_layers:  2
  fc_hidden:        32
  lstm_dropout:     0.2
  k_prod_init:      1.0

training:
  seq_len:      24
  dt:           0.2
  batch_size:   64
  n_epochs:     200

  lr:           1.0e-3
  lr_physics:   1.0e-2
  weight_decay: 1.0e-4

  lr_factor:    0.5
  lr_patience:  15

  es_patience:  30

  grad_clip:    5.0

  # Physics annealing — same schedule as global pls_pi_lstm.yaml
  vanilla_mode:          false
  lambda_physics_start:  0.0
  lambda_physics_end:    0.1
  lambda_anneal_delay:   30
  lambda_anneal_epochs:  80

output:
  checkpoint: ./checkpoints/pls_pi_lstm_regime_ablation.pt
  plots_dir:  ./outputs/pls_pi_lstm_regime_ablation/
