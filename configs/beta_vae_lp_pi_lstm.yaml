# configs/beta_vae_lp_pi_lstm.yaml
# =================================
# β-VAE-LP-PI-LSTM: Physics-Informed LSTM driven by 64-dimensional β-VAE
# latent vectors (posterior means, β=4.0) extracted from Raman spectra.
#
# Unlike beta_vae_pi_lstm.yaml (simplified mass-balance, penicillin only),
# this model uses the FULL Logistic + Luedeking-Piret ODE and predicts
# BOTH biomass and penicillin simultaneously via BioreactorLogiPINN.
#
# Split: random 80/20 of all 90 fault-free batches (ids 0–89), seed=42.
# Test:  faulty batches 91–100 (ids 90–99), evaluated post-training.

name: beta_vae_lp_pi_lstm

data:
  csv_path:           ./100_Batches_IndPenSim_V3.csv
  use_raman:          true
  raman_encoder_type: beta_vae
  raman_ckpt:         ./checkpoints/beta_vae_best.pt
  raman_scaler:       ./checkpoints/beta_vae_scaler.joblib
  raman_latent_dim:   64

  split_strategy:     random
  train_frac:         0.80
  seed:               42
  min_len:            50

model:
  hidden_size:      64
  num_lstm_layers:  2
  fc_hidden:        32
  lstm_dropout:     0.2
  r_n_init:         45.0        # r_phys_init × t_range ≈ 0.2 h⁻¹ × 226 h
  y_max_n_init:     1.05
  alpha_n_init:     1.0
  beta_n_init:      1.0

training:
  seq_len:      24
  dt:           0.2
  batch_size:   64
  n_epochs:     200

  lr:           1.0e-3
  lr_physics:   1.0e-2
  weight_decay: 1.0e-4

  lr_factor:    0.5
  lr_patience:  15

  es_patience:  30

  grad_clip:    5.0

  vanilla_mode:          false
  lambda_physics_start:  0.0
  lambda_physics_end:    0.1
  lambda_anneal_delay:   30
  lambda_anneal_epochs:  80
  lambda_r_neg:          1.0

output:
  checkpoint: ./checkpoints/beta_vae_lp_pi_lstm.pt
  plots_dir:  ./outputs/beta_vae_lp_pi_lstm/
